version: '3.8'

services:
  # 1. MongoDB Database Container
  database:
    image: mongo:latest
    container_name: notes_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - notes_network

  # 2. Node.js Backend Container
  backend:
    build: ./backend
    container_name: notes_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://database:27017/notes_sharing
      - ADMIN_API_KEY=Nandkumar
      - STORAGE_MODE=local
      - MAX_FILE_SIZE_MB=100
    depends_on:
      - database
    networks:
      - notes_network

  # 3. React Frontend Container (served via Nginx)
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: notes_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - notes_network

volumes:
  mongo_data:

networks:
  notes_network:
    driver: bridge
